# =============================================================================
# ArgoCD Applications - ToggleMaster Fase 4 (Apps + Observabilidade + Self-Healing)
# =============================================================================
# Este arquivo configura o ArgoCD (GitOps) para monitorar e sincronizar:
# 1. Os 5 microsserviços do ToggleMaster (namespace: togglemaster)
# 2. A stack de Monitoramento Opensource via Helm Charts (Prometheus, Grafana, Loki)
# 3. O OpenTelemetry Collector, Dashboards, Alertas e Self-Healing (namespace: monitoring)
# =============================================================================

# Base Resources (Namespaces, ConfigMaps, Secrets, Ingress)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RicardoMarassato/fiap-postech-tc4-togglemaster.git
    targetRevision: main
    path: gitops/base
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
