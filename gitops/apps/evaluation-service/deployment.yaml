# =============================================================================
# Evaluation Service - Kubernetes Deployment (Instrumentado com OpenTelemetry)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: evaluation-service
          image: 202191080012.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service:v1.0.0-b656c36
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: PORT
              value: "8004"
            - name: ENVIRONMENT
              value: "production"
            - name: OTEL_SERVICE_NAME
              value: "evaluation-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: url
            - name: FLAG_SERVICE_URL
              value: "http://flag-service:8002"
            - name: TARGETING_SERVICE_URL
              value: "http://targeting-service:8003"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secrets
                  key: api-key
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: sqs-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      protocol: TCP
      name: http
  selector:
    app: evaluation-service
