# =============================================================================
# Secrets de Observabilidade (New Relic, OpsGenie e Discord)
# =============================================================================
# Nota: Os valores das chaves são injetados via ./helpers/configure-observability-secrets.sh
# (a partir do arquivo local .env.observability ignorado no Git) para evitar que
# o GitHub/Discord revogue o webhook por exposição em repositório público e
# para que o ArgoCD não sobrescreva os valores reais com placeholders.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-secrets-info
  namespace: monitoring
data:
  managed-by: "configure-observability-secrets.sh"
