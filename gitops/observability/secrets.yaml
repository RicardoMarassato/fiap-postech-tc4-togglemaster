# =============================================================================
# Secrets de Observabilidade, APM (New Relic), Incidentes (PagerDuty) e ChatOps (Discord)
# =============================================================================
# Dica: Use o script ./helpers/configure-observability-secrets.sh para atualizar
# estas chaves no cluster sem precisar commitar credenciais reais no Git.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: observability-secrets
  namespace: monitoring
type: Opaque
stringData:
  # Chave de Ingest License Key do New Relic (40 caracteres terminando em NRAL)
  NEW_RELIC_LICENSE_KEY: "REPLACE_WITH_NEW_RELIC_LICENSE_KEY"
  # Endpoint OTLP do New Relic (US: https://otlp.nr-data.net:4318 | EU: https://otlp.eu01.nr-data.net:4318)
  NEW_RELIC_OTLP_ENDPOINT: "https://otlp.nr-data.net:4318"
  # Integration Key (Events API v2) do Serviço no PagerDuty
  PAGERDUTY_INTEGRATION_KEY: "REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY"
  # URL do Webhook do canal de alertas no Discord
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/000000000000000000/REPLACE_WITH_DISCORD_WEBHOOK"
  # Personal Access Token opcional do GitHub para acionar o workflow repository_dispatch
  GITHUB_TOKEN: ""
